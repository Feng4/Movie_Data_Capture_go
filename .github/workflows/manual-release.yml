name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.1.1)'
        required: true
        default: 'v1.1.1'
        type: string
      create_tag:
        description: '是否创建Git标签'
        required: true
        default: true
        type: boolean
      notes:
        description: '额外发布说明（可选，会追加在更新日志之后）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build for ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows（amd64 宿主机可运行 386 二进制）
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
            verify: true

          - os: windows
            arch: 386
            runner: windows-latest
            ext: .exe
            verify: true

          # Linux（amd64 宿主机可运行 386；arm/arm64 为交叉编译，无法本机执行）
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
            verify: true

          - os: linux
            arch: 386
            runner: ubuntu-latest
            ext: ''
            verify: true

          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ''
            verify: false

          - os: linux
            arch: arm
            runner: ubuntu-latest
            ext: ''
            verify: false

          # macOS（macos-latest 为 arm64；amd64 为交叉编译，无法本机执行）
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: ''
            verify: false

          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
            verify: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test ./... -p 1

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X main.Version=${{ inputs.version }}" -o mdc-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} main.go

    - name: Verify binary
      if: matrix.verify
      run: |
        BIN="mdc-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
        if [ "${{ matrix.os }}" = "windows" ]; then
          ./$BIN -version
        else
          chmod +x "$BIN" && ./$BIN -version
        fi
      shell: bash

    - name: Prepare release package
      run: |
        BUILD_DIR="release-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}"
        mkdir -p "$BUILD_DIR"

        cp mdc-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} "$BUILD_DIR/"

        [ -f config.yaml ] && cp config.yaml "$BUILD_DIR/"
        [ -f config_template.yaml ] && cp config_template.yaml "$BUILD_DIR/"
        [ -f README.md ] && cp README.md "$BUILD_DIR/"
        [ -d Img ] && cp -r Img "$BUILD_DIR/"
        [ -d docs ] && cp -r docs "$BUILD_DIR/"

        if [ "${{ matrix.os }}" = "windows" ]; then
          powershell -Command "Compress-Archive -Path '$BUILD_DIR/*' -DestinationPath 'mdc-${{ matrix.os }}-${{ matrix.arch }}.zip' -Force"
        else
          tar -czf mdc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C "$BUILD_DIR" .
        fi

        rm -rf "$BUILD_DIR"
      shell: bash

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: mdc-${{ matrix.os }}-${{ matrix.arch }}
        path: mdc-${{ matrix.os }}-${{ matrix.arch }}.zip
        retention-days: 30

    - name: Upload artifact (Unix)
      if: matrix.os != 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: mdc-${{ matrix.os }}-${{ matrix.arch }}
        path: mdc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
        retention-days: 30

  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    if: inputs.create_tag
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create and push tag
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag ${{ inputs.version }}
        git push origin ${{ inputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create Release
    needs: [build, create-tag]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract changelog from README
      id: changelog
      run: |
        VERSION="${{ inputs.version }}"
        awk -v ver="$VERSION" '
          $0 ~ "^### " { if (found) exit; if (index($0, ver)) found=1 }
          found { print }
        ' README.md > changelog.md

        if [ -s changelog.md ]; then
          echo "=== 提取到的更新日志 ==="
          cat changelog.md
        else
          echo "README 中未找到 $VERSION 的更新日志段落，使用默认说明" >&2
          echo "### $VERSION" > changelog.md
          echo "" >> changelog.md
          echo "手动发布版本，包含所有最新功能和修复。" >> changelog.md
        fi

        if [ -n "${{ inputs.notes }}" ]; then
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "" >> changelog.md
          echo "### 📌 本次补充说明" >> changelog.md
          echo "" >> changelog.md
          echo "${{ inputs.notes }}" >> changelog.md
        fi
      shell: bash

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded files
      run: find ./artifacts -type f | sort

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.version }}
        name: Movie Data Capture Go ${{ inputs.version }}
        body_path: changelog.md
        draft: false
        prerelease: false
        files: |
          ./artifacts/*/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
